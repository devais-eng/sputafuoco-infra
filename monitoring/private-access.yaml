# Loopback-only bridge: Tailscale Serve proxies localhost, not ClusterIP addresses.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loopback-proxy
  namespace: monitoring
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 127.0.0.1:13000;
        location / {
          proxy_pass http://ci-monitoring-grafana.monitoring.svc.cluster.local;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 300s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-loopback-proxy
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana-loopback-proxy}
  template:
    metadata:
      labels: {app: grafana-loopback-proxy}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: sputafuoco}
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          command: [nginx, -c, /etc/nginx-ci/nginx.conf, -g, 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {host: 127.0.0.1, port: 13000, path: /api/health}
            timeoutSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/nginx-ci, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: grafana-loopback-proxy}
        - name: tmp
          emptyDir: {}
