apiVersion: v1
kind: ConfigMap
metadata:
  name: sputafuoco-ci-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  sputafuoco-ci.json: '{"uid": "sputafuoco-ci", "title": "Sputafuoco \u00b7 CI", "schemaVersion":
    39, "version": 1, "timezone": "Europe/Rome", "refresh": "30s", "time": {"from":
    "now-1h", "to": "now"}, "tags": ["CI", "sputafuoco"], "panels": [{"id": 1, "title":
    "CPU nodo", "type": "timeseries", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId":
    "A", "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])))",
    "legendFormat": "CPU"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 2, "title": "RAM utilizzata",
    "type": "timeseries", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr":
    "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes", "legendFormat":
    "RAM"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options":
    {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]},
    "tooltip": {"mode": "multi"}}}, {"id": 3, "title": "RAM disponibile", "type":
    "timeseries", "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "node_memory_MemAvailable_bytes",
    "legendFormat": "Disponibile"}], "fieldConfig": {"defaults": {"unit": "bytes"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 4,
    "title": "Swap utilizzata", "type": "timeseries", "gridPos": {"x": 12, "y": 8,
    "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes",
    "legendFormat": "Swap"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 5, "title": "Filesystem:
    spazio utilizzato", "type": "timeseries", "gridPos": {"x": 0, "y": 16, "w": 12,
    "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "node_filesystem_size_bytes{mountpoint=~\"/|/srv/data|/srv/runner-ssd\"}
    - node_filesystem_free_bytes{mountpoint=~\"/|/srv/data|/srv/runner-ssd\"}", "legendFormat":
    "{{mountpoint}}"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 6, "title": "Filesystem:
    spazio disponibile", "type": "timeseries", "gridPos": {"x": 12, "y": 16, "w":
    12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "node_filesystem_avail_bytes{mountpoint=~\"/|/srv/data|/srv/runner-ssd\"}",
    "legendFormat": "{{mountpoint}}"}], "fieldConfig": {"defaults": {"unit": "bytes"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 7,
    "title": "Filesystem: capacit\u00e0 totale", "type": "timeseries", "gridPos":
    {"x": 0, "y": 24, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "targets": [{"refId": "A", "expr": "node_filesystem_size_bytes{mountpoint=~\"/|/srv/data|/srv/runner-ssd\"}",
    "legendFormat": "{{mountpoint}}"}], "fieldConfig": {"defaults": {"unit": "bytes"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 8,
    "title": "Filesystem: inode utilizzati", "type": "timeseries", "gridPos": {"x":
    12, "y": 24, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "100 * (1-node_filesystem_files_free{mountpoint=~\"/|/srv/data|/srv/runner-ssd\"}/node_filesystem_files{mountpoint=~\"/|/srv/data|/srv/runner-ssd\"})",
    "legendFormat": "{{mountpoint}}"}], "fieldConfig": {"defaults": {"unit": "percent"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 9,
    "title": "Pressione CPU nodo (some)", "type": "timeseries", "gridPos": {"x": 0,
    "y": 32, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "100 * rate(node_pressure_cpu_waiting_seconds_total[$__rate_interval])",
    "legendFormat": "CPU"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 10, "title": "Pressione
    RAM nodo (some)", "type": "timeseries", "gridPos": {"x": 12, "y": 32, "w": 12,
    "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "100 * rate(node_pressure_memory_waiting_seconds_total[$__rate_interval])",
    "legendFormat": "RAM"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 11, "title": "Pressione
    I/O nodo (some)", "type": "timeseries", "gridPos": {"x": 0, "y": 40, "w": 12,
    "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "100 * rate(node_pressure_io_waiting_seconds_total[$__rate_interval])",
    "legendFormat": "I/O some"}], "fieldConfig": {"defaults": {"unit": "percent"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 12,
    "title": "Pressione I/O nodo (full)", "type": "timeseries", "gridPos": {"x": 12,
    "y": 40, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "100 * rate(node_pressure_io_stalled_seconds_total[$__rate_interval])",
    "legendFormat": "I/O full"}], "fieldConfig": {"defaults": {"unit": "percent"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 13,
    "title": "CPU per pod", "type": "timeseries", "gridPos": {"x": 0, "y": 48, "w":
    12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "sum by(namespace,pod)(rate(container_cpu_usage_seconds_total{pod!=\"\",container!=\"\",container!=\"POD\"}[$__rate_interval]))",
    "legendFormat": "{{namespace}} / {{pod}}"}], "fieldConfig": {"defaults": {"unit":
    "cores"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 14,
    "title": "RAM per pod (working set)", "type": "timeseries", "gridPos": {"x": 12,
    "y": 48, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "sum by(namespace,pod)(container_memory_working_set_bytes{pod!=\"\",container!=\"\",container!=\"POD\"})",
    "legendFormat": "{{namespace}} / {{pod}}"}], "fieldConfig": {"defaults": {"unit":
    "bytes"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 15,
    "title": "Pressione I/O per pod", "type": "timeseries", "gridPos": {"x": 0, "y":
    56, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "100 * sum by(namespace,pod)(rate(container_pressure_io_waiting_seconds_total{pod!=\"\",container=\"\",id=~\".*pod[^/]+[.]slice\"}[$__rate_interval]))",
    "legendFormat": "{{namespace}} / {{pod}}"}], "fieldConfig": {"defaults": {"unit":
    "percent"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 16,
    "title": "Spazio allocato per runner e volume", "type": "timeseries", "gridPos":
    {"x": 12, "y": 56, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "targets": [{"refId": "A", "expr": "ci_runner_volume_used_bytes",
    "legendFormat": "{{pod}} / {{volume}}"}], "fieldConfig": {"defaults": {"unit":
    "bytes"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 17,
    "title": "Et\u00e0 rilevamento spazio runner", "type": "timeseries", "gridPos":
    {"x": 0, "y": 64, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "targets": [{"refId": "A", "expr": "time() - ci_runner_volume_collection_timestamp_seconds",
    "legendFormat": "Et\u00e0"}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 18, "title": "Rilevamento
    spazio runner riuscito", "type": "timeseries", "gridPos": {"x": 12, "y": 64, "w":
    12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "ci_runner_volume_collection_success", "legendFormat":
    "Successo (1)"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 19, "title": "Letture
    per disco fisico", "type": "timeseries", "gridPos": {"x": 0, "y": 72, "w": 12,
    "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "rate(node_disk_read_bytes_total{device=~\"sd[a-c]\"}[$__rate_interval])",
    "legendFormat": "{{device}}"}], "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 20, "title": "Scritture
    per disco fisico", "type": "timeseries", "gridPos": {"x": 12, "y": 72, "w": 12,
    "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "rate(node_disk_written_bytes_total{device=~\"sd[a-c]\"}[$__rate_interval])",
    "legendFormat": "{{device}}"}], "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides":
    []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs":
    ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 21, "title": "Tempo disco
    occupato", "type": "timeseries", "gridPos": {"x": 0, "y": 80, "w": 12, "h": 8},
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId":
    "A", "expr": "100 * rate(node_disk_io_time_seconds_total{device=~\"sd[a-c]\"}[$__rate_interval])",
    "legendFormat": "{{device}}"}], "fieldConfig": {"defaults": {"unit": "percent"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 22,
    "title": "Load average", "type": "timeseries", "gridPos": {"x": 12, "y": 80, "w":
    12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"refId": "A", "expr": "node_load1", "legendFormat": "Load 1m"}], "fieldConfig":
    {"defaults": {"unit": "short"}, "overrides": []}, "options": {"legend": {"displayMode":
    "table", "placement": "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode":
    "multi"}}}, {"id": 23, "title": "ARC: job in esecuzione", "type": "timeseries",
    "gridPos": {"x": 0, "y": 88, "w": 12, "h": 8}, "datasource": {"type": "prometheus",
    "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "gha_running_jobs", "legendFormat":
    "{{actions_github_com_scale_set_name}}"}], "fieldConfig": {"defaults": {"unit":
    "short"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 24,
    "title": "ARC: runner desiderati", "type": "timeseries", "gridPos": {"x": 12,
    "y": 88, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "gha_desired_runners", "legendFormat": "{{actions_github_com_scale_set_name}}"}],
    "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"legend":
    {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}, "tooltip":
    {"mode": "multi"}}}, {"id": 25, "title": "ARC: runner disponibili", "type": "timeseries",
    "gridPos": {"x": 0, "y": 96, "w": 12, "h": 8}, "datasource": {"type": "prometheus",
    "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "gha_idle_runners", "legendFormat":
    "{{actions_github_com_scale_set_name}}"}], "fieldConfig": {"defaults": {"unit":
    "short"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 26,
    "title": "ARC: avvio job p95", "type": "timeseries", "gridPos": {"x": 12, "y":
    96, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by(le,actions_github_com_scale_set_name)(rate(gha_job_startup_duration_seconds_bucket[$__rate_interval])))",
    "legendFormat": "{{actions_github_com_scale_set_name}}"}], "fieldConfig": {"defaults":
    {"unit": "s"}, "overrides": []}, "options": {"legend": {"displayMode": "table",
    "placement": "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}},
    {"id": 27, "title": "Pod in Pending", "type": "timeseries", "gridPos": {"x": 0,
    "y": 104, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "sum by(namespace)(kube_pod_status_phase{phase=\"Pending\"})",
    "legendFormat": "{{namespace}}"}], "fieldConfig": {"defaults": {"unit": "short"},
    "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 28,
    "title": "Restart container (1h)", "type": "timeseries", "gridPos": {"x": 12,
    "y": 104, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "sum by(namespace,pod)(increase(kube_pod_container_status_restarts_total[1h]))",
    "legendFormat": "{{namespace}} / {{pod}}"}], "fieldConfig": {"defaults": {"unit":
    "short"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 29,
    "title": "Pressione CPU per pod", "type": "timeseries", "gridPos": {"x": 0, "y":
    112, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "100 * sum by(namespace,pod)(rate(container_pressure_cpu_waiting_seconds_total{pod!=\"\",container=\"\",id=~\".*pod[^/]+[.]slice\"}[$__rate_interval]))",
    "legendFormat": "{{namespace}} / {{pod}}"}], "fieldConfig": {"defaults": {"unit":
    "percent"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}, {"id": 30,
    "title": "Pressione RAM per pod", "type": "timeseries", "gridPos": {"x": 12, "y":
    112, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "100 * sum by(namespace,pod)(rate(container_pressure_memory_waiting_seconds_total{pod!=\"\",container=\"\",id=~\".*pod[^/]+[.]slice\"}[$__rate_interval]))",
    "legendFormat": "{{namespace}} / {{pod}}"}], "fieldConfig": {"defaults": {"unit":
    "percent"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement":
    "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}}}], "description":
    "Spazio runner: blocchi allocati, campionamento 120s. Verificare et\u00e0 e successo
    raccolta. PVC locali non impongono quote. Disco fisico e RAID non vanno sommati."}'
