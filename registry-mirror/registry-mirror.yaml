# Pull-through cache of Docker Hub for the dind daemons of the sputafuoco-arc runners.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-mirror-ssd
  namespace: arc-runners
  labels: { app: registry-mirror-ssd }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry-mirror-ssd }
  template:
    metadata:
      labels: { app: registry-mirror-ssd }
    spec:
      nodeSelector:
        kubernetes.io/hostname: sputafuoco
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          hostPath:
            path: /srv/runner-ssd/ci-cache/registry
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: registry-mirror
  namespace: arc-runners
spec:
  selector: { app: registry-mirror-ssd }
  ports:
    - port: 5000
      targetPort: 5000
