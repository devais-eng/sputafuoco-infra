name: Runner image

# Builds runner-image/ on GitHub-hosted runners, smoke-tests it, and publishes it to
# ghcr.io/devais-eng/arc-runner-sallo on every push to main. Pull requests build and test
# without publishing. The weekly rebuild picks up base-image security updates and BtbN's
# rolling FFmpeg build. The scale sets run :latest with imagePullPolicy: Always, so every
# new runner pod starts on the newest published image.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - runner-image/**
      - .github/workflows/runner-image.yml
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/arc-runner-sallo

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the runner version
        id: runner
        run: |
          version="$(sed -n 's/^ARG RUNNER_VERSION=//p' runner-image/Dockerfile)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # <runner version>-<build date>-<commit>: immutable, what arc/values-*.yaml pins.
          # latest: moving, for humans only.
          tags: |
            type=raw,value=${{ steps.runner.outputs.version }}-{{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=arc-runner-sallo

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: runner-image
          load: true
          tags: arc-runner-sallo:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm -i arc-runner-sallo:ci bash -s < runner-image/smoke-test.sh

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: runner-image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
