# Dedicated SSD provisioner; install before either runner scale set.
# Adapted from Rancher local-path-provisioner v0.0.37 (Apache-2.0).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-ssd-provisioner-service-account
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-ssd-provisioner-role
  namespace: arc-runners
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runner-ssd-provisioner-role
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - persistentvolumeclaims
  - configmaps
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-ssd-provisioner-bind
  namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-ssd-provisioner-role
subjects:
- kind: ServiceAccount
  name: runner-ssd-provisioner-service-account
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runner-ssd-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runner-ssd-provisioner-role
subjects:
- kind: ServiceAccount
  name: runner-ssd-provisioner-service-account
  namespace: arc-runners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-ssd-provisioner
  namespace: arc-runners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runner-ssd-provisioner
  template:
    metadata:
      labels:
        app: runner-ssd-provisioner
    spec:
      serviceAccountName: runner-ssd-provisioner-service-account
      containers:
      - name: runner-ssd-provisioner
        image: docker.io/rancher/local-path-provisioner:v0.0.37
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        - --provisioner-name
        - devais.eng/runner-ssd
        - --service-account-name
        - runner-ssd-provisioner-service-account
        - --configmap-name
        - runner-ssd-config
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_MOUNT_PATH
          value: /etc/config/
        - name: HEALTH_PORT
          value: '8080'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: config-volume
        configMap:
          name: runner-ssd-config
      nodeSelector:
        kubernetes.io/hostname: sputafuoco
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: runner-ssd
  annotations:
    defaultVolumeType: local
provisioner: devais.eng/runner-ssd
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: runner-ssd-config
  namespace: arc-runners
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "sputafuoco",
          "paths": [
            "/srv/runner-ssd"
          ]
        },
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": []
        }
      ]
    }
  setup: |
    #!/bin/sh
    set -eu
    case "$VOL_DIR" in /srv/runner-ssd/pvc-*) ;; *) echo "Unexpected volume path" >&2; exit 1;; esac
    name=${VOL_DIR#/srv/runner-ssd/}
    case "$name" in */*|*..*) echo "Unsafe volume path" >&2; exit 1;; esac
    [ -s /srv/runner-ssd/.runner-ssd-volume ] || { echo "SSD mount marker missing" >&2; exit 1; }
    [ ! -L "$VOL_DIR" ] || { echo "Volume path is a symlink" >&2; exit 1; }
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |
    #!/bin/sh
    set -eu
    case "$VOL_DIR" in /srv/runner-ssd/pvc-*) ;; *) echo "Unexpected volume path" >&2; exit 1;; esac
    name=${VOL_DIR#/srv/runner-ssd/}
    case "$name" in */*|*..*) echo "Unsafe volume path" >&2; exit 1;; esac
    [ -s /srv/runner-ssd/.runner-ssd-volume ] || { echo "SSD mount marker missing" >&2; exit 1; }
    [ ! -L "$VOL_DIR" ] || { echo "Volume path is a symlink" >&2; exit 1; }
    rm -rf -- "$VOL_DIR"
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      containers:
      - name: helper-pod
        image: rancher/mirrored-library-busybox:1.37.0
        imagePullPolicy: IfNotPresent
