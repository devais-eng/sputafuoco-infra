# gha-runner-scale-set 0.15.1 — sputafuoco-arc (label sallo)
# Expanded dind template (from the chart's own containerMode=dind template), plus:
#   - /var/lib/docker on an emptyDir (kubelet root-dir = /srv/data/kubelet), not the root fs
#   - Docker Hub pull-through mirror
githubConfigUrl: https://github.com/devais-eng
githubConfigSecret: github-app
runnerScaleSetName: sputafuoco-arc
scaleSetLabels: ["sallo"]
minRunners: 0
maxRunners: 3

template:
  spec:
    initContainers:
      # .NET crash reports land on the node, so they outlive the pod (see dotnet-crash below).
      - name: init-dotnet-crash-dir
        image: docker:dind
        command: ["sh", "-c", "chmod 1777 /dotnet-crash"]
        volumeMounts:
          - name: dotnet-crash
            mountPath: /dotnet-crash
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --registry-mirror=http://registry-mirror.arc-runners.svc.cluster.local:5000
          - --insecure-registry=registry-mirror.arc-runners.svc.cluster.local:5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # Crash diagnostics for Runner.Listener/Runner.Worker (inherited by the worker).
          - name: DOTNET_DbgEnableMiniDump
            value: "1"
          - name: DOTNET_DbgMiniDumpType
            value: "1"
          - name: DOTNET_EnableCrashReport
            value: "1"
          - name: DOTNET_DbgMiniDumpName
            value: /dotnet-crash/%e-%p-%t.dmp
        resources:
          requests: { cpu: "2", memory: 4Gi }
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dotnet-crash
            mountPath: /dotnet-crash
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: dind-storage
        emptyDir: {}
      - name: dotnet-crash
        hostPath:
          path: /srv/data/ci-cache/dotnet-crash
          type: DirectoryOrCreate
